name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Vendored weights are committed, so this must pass with no network.
      # If it starts needing a download, the vendoring has regressed.
      - name: Verify vendored model weights
        run: python3 fetch_models.py --verify

      - name: DSP validation (no camera, no model weights)
        run: |
          python3 tests/test_rppg.py
          python3 tests/test_face.py

      - name: Property tests (windowing, geometry, output contracts)
        run: python3 tests/test_properties.py

      - name: Parameter ranges (catalogue as oracle)
        run: python3 tests/test_parameter_ranges.py

      - name: Audio prosody (Group D)
        run: python3 tests/test_audio.py

      - name: Structured interview engine (WP3)
        run: python3 tests/test_interview.py

      # ASR itself is covered by tests/test_text_asr.py, run on demand: it
      # downloads a ~140 MB model. The content measures are fully covered here.
      - name: Linguistic content (Group E)
        run: python3 tests/test_text.py

      - name: Transcript line breaking (WP5)
        run: python3 tests/test_transcript_lines.py

      - name: End-to-end selftest (synthetic frames)
        run: python3 run_live.py --selftest

      # Guards the v1.0 -> v1.1 regression: mediapipe 1.0.x aborts the process
      # at graph construction on some platforms, and an unpinned >=0.10.14
      # resolves straight to it.
      - name: Assert mediapipe stays below 1.0
        run: |
          python3 -c "
          import mediapipe, sys
          major = int(mediapipe.__version__.split('.')[0])
          print('mediapipe', mediapipe.__version__)
          sys.exit(0 if major < 1 else 'mediapipe 1.x reintroduces the macOS Metal abort; keep the <1.0 pin')
          "
